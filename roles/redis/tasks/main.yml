---
- name: Install Redis
  ansible.builtin.apt:
    name: redis-server
    state: present

- name: Deploy Redis configuration
  ansible.builtin.copy:
    src: redis.conf
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: '0640'
  notify: Restart Redis

- name: Ensure Redis is enabled and started
  ansible.builtin.systemd:
    name: redis-server
    enabled: true
    state: started