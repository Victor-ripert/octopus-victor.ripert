---
- name: Install python3 and pip
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present

- name: Create poll directory
  ansible.builtin.file:
    path: /opt/poll
    state: directory
    mode: '0755'

- name: Upload poll archive
  ansible.builtin.unarchive:
    src: "{{ playbook_dir }}/poll.tar"
    dest: /opt/poll
    creates: /opt/poll/app.py

- name: Install poll dependencies
  ansible.builtin.pip:
    requirements: /opt/poll/requirements.txt
    virtualenv: /opt/poll/venv
    virtualenv_command: python3 -m venv

- name: Deploy poll systemd service
  ansible.builtin.template:
    src: poll.service.j2
    dest: /etc/systemd/system/poll.service
    mode: '0644'
  notify: Reload systemd

- name: Enable and start poll service
  ansible.builtin.systemd:
    name: poll
    enabled: true
    state: started
    daemon_reload: true